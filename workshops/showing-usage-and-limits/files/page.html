<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidewater Books</title>
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 15px/1.45 system-ui, sans-serif; }
  header { padding: 10px 14px; background: #1f4e5f; color: white; font-weight: 600; }
  header select { float: right; }
  #tools, #status { margin: 0; padding: 4px 14px; font-size: 12px; color: #567; background: #f4f6f7; }
  #tools:empty, #status:empty { display: none; }
  details { padding: 6px 14px; font-size: 13px; border-bottom: 1px solid #d5dbde; }
  details a { display: block; padding: 2px 0; color: #1f4e5f; }
  details a.current { font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; }
  #messages div { width: fit-content; max-width: 85%; margin: 0 0 10px; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
  .user { margin-left: auto !important; background: #1f4e5f; color: white; }
  .assistant { background: #e9eef0; }
  .tool { font: 12px/1.4 ui-monospace, monospace; color: #567; border: 1px dashed #b9c4c9; overflow-wrap: anywhere; }
  .tool.worked { border-style: solid; }
  .tool.failed, .problem { border: 1px solid #b3392f; color: #b3392f; }
  .approval { background: #fff6dd; border: 1px solid #d9b949; }
  .approval button { margin: 8px 8px 0 0; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #d5dbde; }
  #box { flex: 1; min-width: 0; padding: 8px; font: inherit; }
  button { padding: 8px 14px; font: inherit; }
</style>
</head>
<body>
<header>
  Tidewater Books
</header>
<p id="tools"></p>
<details>
  <summary>Conversations</summary>
  <a href="/?new">Start a new one</a>
  <a id="branch">Branch from this one</a>
  <nav id="list"></nav>
</details>
<main id="messages"></main>
<form id="form">
  <input id="box" placeholder="Ask the assistant" autocomplete="off">
  <button>Send</button>
  <button type="button" id="stop">Stop</button>
</form>
<script>
const messages = document.getElementById("messages");
const form = document.getElementById("form");
const box = document.getElementById("box");
const params = new URLSearchParams(location.search);

// This page's conversation has an id, kept in the browser's storage so that
// a reload carries on with it. /?new forgets it and starts another.
if (params.has("new")) localStorage.removeItem("conversation");
// /?c=<id> swaps it for the id of another conversation.
if (params.has("c")) localStorage.setItem("conversation", params.get("c"));
let conversation = localStorage.getItem("conversation") || crypto.randomUUID();
localStorage.setItem("conversation", conversation);

function post(path, body) {
  return fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
}

function add(kind, text) {
  const bubble = document.createElement("div");
  bubble.className = kind;
  bubble.textContent = text;
  messages.append(bubble);
  bubble.scrollIntoView();
  return bubble;
}

function failed() {
  add("problem", "The server did not answer. Is it still running?");
}

// Read a streamed response as the events the server sent: one JSON object on each "data:" line.
async function* events(response) {
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = "";
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buffer += value;
    const lines = buffer.split("\n");
    buffer = lines.pop();
    for (const line of lines) {
      if (line.startsWith("data: ")) yield JSON.parse(line.slice(6));
    }
  }
}

async function send(text) {
  add("user", text);
  let reply = add("assistant", "…");
  let written = "";

  // Put a line that is not the model's words above the bubble being waited for.
  function aside(kind, text) {
    if (written) {
      reply = add("assistant", "…");
      written = "";
    }
    const line = add(kind, text);
    reply.before(line);
    return line;
  }

  const response = await post("/chat", {conversation, message: text});
  for await (const event of events(response)) {
    if (event.type === "text") {
      written += event.text;
      reply.textContent = written;
    } else if (event.type === "tools") {
      document.getElementById("tools").textContent = event.model + " with " + event.names.join(", ");
    } else if (event.type === "tool") {
      aside("tool", event.name + " " + JSON.stringify(event.input).slice(0, 160)).id = event.id;
    } else if (event.type === "tool_result") {
      const line = document.getElementById(event.id);
      line.classList.add(event.error ? "failed" : "worked");
      line.textContent += event.error ? "\nfailed" : `\nreturned ${event.size} characters`;
    } else if (event.type === "approval") {
      const card = aside("approval", `The assistant wants to write ${event.file}:\n\n${event.content}\n`);
      card.id = event.id;
      for (const [label, allow] of [["Allow", true], ["Refuse", false]]) {
        const button = document.createElement("button");
        button.textContent = label;
        button.onclick = () => post("/approve", {id: event.id, allow});
        card.append(button);
      }
    } else if (event.type === "answered") {
      const card = document.getElementById(event.id);
      card.querySelectorAll("button").forEach((button) => button.remove());
      card.append("\n" + event.answer);
    } else if (event.type === "done") {
      if (!written) reply.remove();
    }
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = box.value.trim();
  if (text) {
    box.value = "";
    send(text).catch(failed);
  }
});

document.getElementById("stop").onclick = () => post("/stop", {conversation});

async function start() {
  // /?branch=<id> copies that conversation and carries on in the copy.
  if (params.has("branch")) {
    const response = await post("/fork", {conversation: params.get("branch")});
    conversation = (await response.json()).conversation;
    localStorage.setItem("conversation", conversation);
  }

  // Show what has been said in this conversation so far.
  const said = await (await fetch("/history/" + conversation)).json();
  for (const item of said) add(item.role, item.text);

  // List the conversations the server can find.
  document.getElementById("branch").href = "/?branch=" + conversation;
  for (const item of await (await fetch("/conversations")).json()) {
    const link = document.createElement("a");
    link.href = "/?c=" + item.id;
    link.textContent = item.title;
    if (item.id === conversation) link.className = "current";
    document.getElementById("list").append(link);
  }

  // A question in the address, as in /?ask=When+do+we+open, is asked as the
  // page loads, unless this conversation has been asked it already.
  const asked = params.get("ask");
  if (asked && !said.some((item) => item.role === "user" && item.text === asked)) await send(asked);
}

start().catch(failed);
</script>
</body>
</html>
