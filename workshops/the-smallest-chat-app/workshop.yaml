apiVersion: jupyterlab-workshop/v1alpha1
name: the-smallest-chat-app
title: Build the smallest chat app
version: 0.1.0
description: Put an agent behind a web page. Start a small web server written with FastAPI, see what a chat page and its server say to each other, replace the server's canned reply with a run of the agent, and find out what the application cannot do yet.
authors: [Graham Dumpleton]
homepage: https://github.com/GrahamDumpleton/claude-sdk-workshops/tree/main/workshops/the-smallest-chat-app
issues: https://github.com/GrahamDumpleton/claude-sdk-workshops/issues
tags: [python, claude, agents, fastapi]
duration: 20m
platforms: [linux, macos]
capabilities:
  - terminal
  - write-files
  - kernel-exec
requires:
  tools:
    - { name: claude, optional: true }
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
layout: app
layouts:
  app:
    main:
      split: columns
      areas:
        - areas:
            - { name: code, tabs: ['file:app.py', 'file:page.html'] }
            - { name: shell, size: 0.3, tabs: ['terminal:server'] }
        - { name: chat, size: 0.38, tabs: [] }
gating: soft
finish: |
  You have put an agent behind a web page. The page sends what was
  typed to the server as JSON, a route on the server runs the agent
  with `query()` and waits for the `ResultMessage`, and the reply goes
  back as JSON for the page to show. You also saw what that leaves
  out: nothing appears until the whole reply is written, and every
  message starts a session that knows nothing of the last.

  Next is **Stream the reply to the browser**, which sends the reply
  to the page as the model writes it.

  [Hosting the Agent SDK](https://code.claude.com/docs/en/agent-sdk/hosting)
  in the SDK's documentation covers what running an agent inside a
  server involves.
variables:
  - name: server_port
    type: number
    default: 8101
    description: The port the chat server listens on
  - name: app_python
    type: text
    description: The Python that JupyterLab runs on, which has the SDK installed
pages:
  - pages/01-welcome.md
  - pages/02-a-server-with-no-agent.md
  - pages/03-put-the-agent-behind-it.md
  - pages/04-every-message-starts-again.md
  - pages/05-what-is-missing.md
